<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin — My Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./Css pages/Homepage.Css" />
    <link rel="stylesheet" href="./Css pages/Admin.Css" />
  </head>
  <body>
    <main class="admin-wrapper">
      <!-- Login form -->
      <section id="login-section" class="admin-card">
        <h1 class="admin-heading">Admin Login</h1>
        <form id="login-form">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username" />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            required
            autocomplete="current-password"
          />

          <button type="submit">Log In</button>
        </form>
        <p id="login-error" class="admin-error" hidden></p>
      </section>

      <!-- Post editor (hidden until logged in) -->
      <section id="editor-section" class="admin-card" hidden>
        <div class="admin-header-row">
          <h1 class="admin-heading">New Post</h1>
          <button id="logout-btn" class="admin-logout">Log Out</button>
        </div>

        <form id="post-form">
          <label for="title">Title</label>
          <input type="text" id="title" required />

          <label for="image_url">Image URL (optional)</label>
          <input type="url" id="image_url" placeholder="https://..." />

          <label for="content">Content</label>
          <textarea id="content" rows="12" required></textarea>

          <button type="submit">Publish Post</button>
        </form>
        <p id="post-status" class="admin-status" hidden></p>

        <hr />

        <h2 class="admin-subheading">Your Posts</h2>
        <div id="my-posts-list"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./JavaScript/supabase-config.js"></script>
    <script src="./JavaScript/Admin.js"></script>
  </body>
</html>
